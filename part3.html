<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>太平日報 - 官方安全網絡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --vh: 1vh;
        }

        * {
            /* 全局套用 manipulation，由瀏覽器原生阻擋雙擊放大，保證按鈕點擊零延遲 */
            touch-action: manipulation; 
        }

        html, body {
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            width: 100vw;
            overflow: hidden; 
            overscroll-behavior: none;
            background-color: #F0F2F5;
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        .font-serif-tc { font-family: 'Noto Serif TC', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .crt-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: 80;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s;
        }

        #news-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            background-color: #F0F2F5;
            transition: transform 0.5s, filter 0.5s;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: none;
            padding-bottom: calc(2rem + env(safe-area-inset-bottom));
            touch-action: pan-y; /* 僅允許上下滑動 */
        }

        #terminal-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(80% + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: rgba(5, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 50;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            border-top: 2px solid #dc2626;
            box-shadow: 0 -20px 40px rgba(220, 38, 38, 0.3);
            display: flex;
            flex-direction: column;
        }

        .msg-bubble {
            animation: slideInFade 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes slideInFade {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .severe-glitch {
            animation: rgbSplit 0.2s infinite alternate, tearScreen 1s infinite;
        }
        @keyframes rgbSplit {
            0% { text-shadow: -2px 0 red, 2px 0 cyan; }
            100% { text-shadow: 2px 0 red, -2px 0 cyan; }
        }
        @keyframes tearScreen {
            0%, 100% { clip-path: inset(0 0 0 0); }
            20% { clip-path: inset(20% -20px 60% 0); transform: translateX(-5px); }
            40% { clip-path: inset(60% -20px 10% 0); transform: translateX(5px); }
            60% { clip-path: inset(40% -20px 50% 0); transform: translateX(-2px); }
            80% { clip-path: inset(80% -20px 5% 0); transform: translateX(3px); }
        }

        .whiteout {
            position: absolute;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-in;
        }

        .liar-text {
            position: absolute;
            color: #ff0000;
            font-weight: 900;
            font-family: 'Noto Serif TC', serif;
            pointer-events: none;
            mix-blend-mode: exclusion;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        #blood-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(150,0,0,0.8) 100%);
            opacity: 0;
            z-index: 45;
            pointer-events: none;
            transition: opacity 5s linear;
        }

        /* 增強按鈕點擊手感 */
        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent; /* 移除點擊時的藍色閃爍 */
        }
    </style>
</head>
<body>

    <div id="start-screen" class="absolute inset-0 bg-white z-[100] flex flex-col items-center justify-center p-6 text-center transition-opacity duration-500">
        <h1 class="font-serif-tc text-4xl font-black text-black tracking-widest mb-2">太平日報</h1>
        <p class="text-xs text-gray-500 tracking-[0.3em] mb-12 uppercase">安全・真實・穩定</p>
        <button id="btn-start" onclick="void(0);" class="w-full max-w-xs border border-black text-black font-bold py-4 rounded-sm tracking-widest active:bg-gray-100 transition-colors">
            同意接收官方訊號
        </button>
    </div>

    <div id="news-layer">
        <header class="sticky top-0 w-full bg-white shadow-sm z-20" style="padding-top: env(safe-area-inset-top);">
            <div class="px-5 py-4 flex justify-between items-center">
                <div class="font-serif-tc font-black text-2xl text-black">太平日報</div>
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <div class="text-xs text-gray-400 font-mono">連線安全</div>
                </div>
            </div>
        </header>

        <main class="p-5 max-w-md mx-auto relative">
            <h1 class="text-3xl font-serif-tc font-black mb-4 leading-snug">市區天際線<br>呈現罕見「暮光紅」</h1>
            <p class="text-gray-500 text-sm mb-6">發布時間：剛剛</p>
            
            <div class="w-full h-48 bg-gray-200 mb-6 relative overflow-hidden rounded">
                <img src="https://images.unsplash.com/photo-1542401886-65d6c61db217?w=600&q=80" class="w-full h-full object-cover grayscale opacity-60 mix-blend-multiply" alt="sky">
            </div>

            <p class="text-base text-gray-700 leading-loose mb-4">
                氣象局於今日發布聲明，近期天空呈現紅灰色為正常大氣折射現象。請市民安心，切勿聽信網路上關於「火災」與「爆炸」的無端謠言。
            </p>
            <p class="text-base text-gray-700 leading-loose mb-8 font-bold">
                「天空的顏色本來就是灰灰紅紅的，請家長如此教導孩童，切勿驚慌。」發言人表示。
            </p>
            
            <button id="trigger-hack" onclick="void(0);" class="w-full relative overflow-hidden bg-red-50 py-4 border border-red-200 rounded transition-all duration-300">
                <div class="text-red-600 text-sm font-bold tracking-widest flex items-center justify-center">
                    <span class="mr-2">⚠️</span> 偵測到周邊異常訊號，點擊排除
                </div>
            </button>
        </main>
    </div>

    <div id="blood-bg"></div>
    <div class="crt-overlay" id="crt"></div>

    <div id="terminal-layer">
        <div class="bg-black text-red-500 px-4 py-3 text-xs font-mono flex justify-between items-center border-b border-red-900 shadow-md shadow-red-900/20">
            <span>SYS_OVERRIDE // 未授權的攔截</span>
            <span class="animate-pulse">REC 🔴</span>
        </div>
        <div id="chat-container" class="flex-1 p-5 overflow-y-auto font-sans text-sm space-y-5 pb-20 relative">
        </div>
    </div>

    <div id="liar-spawner" class="absolute inset-0 pointer-events-none z-[9000] overflow-hidden"></div>

    <div id="whiteout" class="whiteout">
        <div id="reboot-msg" class="text-center opacity-0 transition-opacity duration-1000">
            <h2 class="font-serif-tc text-3xl font-black text-black mb-6 tracking-[0.5em] ml-[0.5em]">系統淨化完成</h2>
            <p class="text-gray-400 tracking-widest text-sm leading-loose">
                沒有火災。<br>
                孩子只是做夢。<br>
                一切都會變好。
            </p>
        </div>
    </div>

    <script>
        function setViewportHeight() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', setViewportHeight);
        setViewportHeight();

        // 僅阻擋多指手勢(如雙指縮放)，不再阻擋正常的單指點擊(click)
        document.addEventListener('touchmove', function (event) {
            if (event.touches.length > 1) { 
                event.preventDefault(); 
            }
        }, { passive: false });

        let audioCtx, heartbeatOsc, heartbeatGain, tinnitusOsc, tinnitusGain;
        let heartbeatInterval;
        let heartRate = 1500; 

        function initAudio() {
            if(audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            heartbeatOsc = audioCtx.createOscillator();
            heartbeatGain = audioCtx.createGain();
            heartbeatOsc.type = 'sine';
            heartbeatOsc.frequency.value = 40; 
            heartbeatGain.gain.value = 0;
            
            heartbeatOsc.connect(heartbeatGain);
            heartbeatGain.connect(audioCtx.destination);
            heartbeatOsc.start();

            tinnitusOsc = audioCtx.createOscillator();
            tinnitusGain = audioCtx.createGain();
            tinnitusOsc.type = 'sine';
            tinnitusOsc.frequency.value = 3000;
            tinnitusGain.gain.value = 0;
            
            tinnitusOsc.connect(tinnitusGain);
            tinnitusGain.connect(audioCtx.destination);
            tinnitusOsc.start();
        }

        function playHeartbeat() {
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            heartbeatGain.gain.setValueAtTime(0, now);
            heartbeatGain.gain.linearRampToValueAtTime(0.8, now + 0.1);
            heartbeatGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            
            heartbeatGain.gain.setValueAtTime(0, now + 0.4);
            heartbeatGain.gain.linearRampToValueAtTime(0.6, now + 0.5);
            heartbeatGain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

            if(navigator.vibrate) navigator.vibrate([40, 100, 30]);

            heartbeatInterval = setTimeout(playHeartbeat, heartRate);
        }

        function stopHeartbeat() {
            clearTimeout(heartbeatInterval);
        }

        const chars = '█▓▒░$%&!#@*^~?><▌▐▀▄';
        async function scrambleText(element, finalString, duration = 800) {
            const start = Date.now();
            const originalLength = Math.max(element.innerText.length, finalString.length);
            
            element.classList.add('text-red-500', 'font-mono');
            if(navigator.vibrate) navigator.vibrate(50);

            return new Promise(resolve => {
                const interval = setInterval(() => {
                    const elapsed = Date.now() - start;
                    if (elapsed >= duration) {
                        clearInterval(interval);
                        element.innerText = finalString;
                        element.classList.remove('text-red-500', 'font-mono');
                        element.classList.add('text-gray-400');
                        if(navigator.vibrate) navigator.vibrate(100);
                        resolve();
                        return;
                    }
                    
                    let gibberish = '';
                    for(let i=0; i<originalLength; i++) {
                        gibberish += chars[Math.floor(Math.random() * chars.length)];
                    }
                    element.innerText = gibberish;
                }, 50);
            });
        }

        const chatBox = document.getElementById('chat-container');
        function appendMsg(type, text, id=null) {
            const wrapper = document.createElement('div');
            wrapper.className = `msg-bubble flex ${type === 'sys' ? 'justify-center' : 'justify-start w-full'}`;
            
            const content = document.createElement('div');
            if(id) content.id = id;

            if(type === 'sys') {
                content.className = "text-[10px] font-mono text-red-500 bg-red-950/40 px-3 py-1 rounded border border-red-900 tracking-widest text-center";
                content.innerHTML = text;
            } else {
                content.className = "bg-gray-800 text-gray-100 px-4 py-3 rounded-lg border border-gray-700 shadow-md w-fit max-w-[85%] text-[15px] leading-relaxed";
                content.innerText = text;
            }

            wrapper.appendChild(content);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            return content;
        }

        // 第一個按鈕：進入系統
        document.getElementById('btn-start').addEventListener('click', () => {
            initAudio(); 
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.pointerEvents = 'none';
            }, 500);
        });

        let isHacking = false;
        
        // 第二個按鈕：觸發劇本
        document.getElementById('trigger-hack').addEventListener('click', () => {
            if(isHacking) return;
            isHacking = true;
            
            const triggerBtn = document.getElementById('trigger-hack');
            triggerBtn.innerHTML = '正在攔截底層封包...';
            triggerBtn.classList.add('bg-red-900', 'text-white', 'border-red-900');
            document.getElementById('crt').style.opacity = '1';
            
            playHeartbeat(); 

            setTimeout(() => {
                document.getElementById('terminal-layer').style.transform = 'translateY(0)';
                document.getElementById('news-layer').style.transform = 'scale(0.92) translateY(-20px)';
                document.getElementById('news-layer').style.filter = 'blur(5px) grayscale(0.8)';
                document.getElementById('blood-bg').style.opacity = '1';
                
                runSequence();
            }, 800);
        });

        async function runSequence() {
            const wait = (ms) => new Promise(r => setTimeout(r, ms));

            // [0 - 7秒] 緩慢建立連線
            await wait(2000);
            appendMsg('sys', 'SYS_SCANNING // 正在分析異常封包...');
            await wait(3000);
            appendMsg('sys', '連線建立。攔截到未知來源文字。');
            await wait(2000);

            // [7 - 15秒] 第一波：發現
            let child1 = appendMsg('child', '天空為什麼是紅色的？他們怎麼會說天上有火？', 'msg1');
            await wait(2500);
            appendMsg('sys', '⚠️ 啟動內容清洗 (Protocol: NORMALIZATION)');
            await scrambleText(child1, '天空的顏色本來就是灰灰紅紅的。不要這樣說。', 1500);
            await wait(3000);

            // [15 - 24秒] 第二波：衝突 (心跳加速)
            heartRate = 800; 
            let child2 = appendMsg('child', '可是他們看到了！外面在燒，我們要怎麼說！', 'msg2');
            await wait(2500);
            appendMsg('sys', '⚠️ 啟動記憶覆寫 (Protocol: DENIAL)');
            await scrambleText(child2, '就當作沒有發生。那就說天氣不好。這已經說過一百次了。', 2000);
            await wait(3000);

            // [24 - 29秒] 第三波：絕望 (瀕臨崩潰)
            heartRate = 400; 
            document.body.classList.add('severe-glitch'); 
            let child3 = appendMsg('child', '我分辨不出來白天晚上...這裡看不清楚...救命', 'msg3');
            await wait(2000);
            appendMsg('sys', '🛑 嚴重認知偏差。執行終極篡改。');
            await scrambleText(child3, '我們一起做夢夢到的。告訴他們一切都會變好。', 2500);
            
            // [29 - 34秒] 進入死寂 (漫長懸疑)
            document.body.classList.remove('severe-glitch');
            stopHeartbeat(); 
            await wait(5000);

            // [34 - 36秒] 爆發：騙人病毒
            const liarSpawner = document.getElementById('liar-spawner');
            let spawnCount = 0;
            
            if(audioCtx) {
                const now = audioCtx.currentTime;
                tinnitusGain.gain.setValueAtTime(0, now);
                tinnitusGain.gain.linearRampToValueAtTime(0.5, now + 2); 
            }

            const spawnInterval = setInterval(() => {
                const div = document.createElement('div');
                div.className = 'liar-text';
                div.innerText = '騙人。';
                div.style.left = Math.random() * 90 + '%';
                div.style.top = Math.random() * 90 + '%';
                div.style.fontSize = (Math.random() * 80 + 20) + 'px'; 
                div.style.transform = `rotate(${Math.random() * 60 - 30}deg)`;
                liarSpawner.appendChild(div);
                
                if(navigator.vibrate) navigator.vibrate(15);
                
                spawnCount++;
                if(spawnCount > 50) { 
                    clearInterval(spawnInterval);
                    triggerExplosion();
                }
            }, 40);
        }

        function triggerExplosion() {
            // 1. 極限震動與閃光
            if(navigator.vibrate) navigator.vibrate([300, 100, 500, 100, 1000]);
            
            if(audioCtx) {
                tinnitusGain.gain.setValueAtTime(1, audioCtx.currentTime);
            }

            document.getElementById('terminal-layer').style.display = 'none';
            document.getElementById('news-layer').style.display = 'none';
            
            const whiteout = document.getElementById('whiteout');
            whiteout.style.backgroundColor = "white"; 
            whiteout.style.opacity = '1';

            // 2. 爆炸後 2 秒，浮現粉飾太平的字
            setTimeout(() => {
                if(audioCtx) {
                    tinnitusGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3);
                }
                document.getElementById('reboot-msg').style.opacity = '1';
            }, 2000);

            // 3. 爆炸後 7 秒 (2秒白畫面 + 5秒文字停留)，準備跳轉
            setTimeout(() => {
                document.getElementById('reboot-msg').style.opacity = '0';
                whiteout.style.transition = "background-color 1.5s ease-in";
                whiteout.style.backgroundColor = "#5a0000"; 
                
                if(navigator.vibrate) navigator.vibrate(800);

                // 4. 紅色吞噬完成後，強制跳轉回首頁
                setTimeout(() => {
                    window.location.href = 'index.html'; 
                }, 1500);

            }, 7000); 
        }
    </script>
</body>
</html>
