<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>《煙霧中長大的孩子:防空洞裡學會的事》</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'serif': ['"Noto Serif TC"', 'serif'] },
                    colors: { 'ash-dark': '#050505', 'blood-red': '#4a0000' }
                }
            }
        }
    </script>

    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            color: #d1d1d1;
            overflow: hidden; 
            overscroll-behavior: none;
            user-select: none;
            touch-action: none; 
            -webkit-user-select: none;
        }

        #bg-container {
            position: fixed; inset: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            z-index: 1;
        }

        #bg-pan-layer {
            display: flex;
            position: absolute;
            top: 0; left: 0;
            will-change: transform;
            height: 100%;
        }
        
        .bg-image {
            display: block;
            max-width: none;
        }

        .noise-overlay {
            position: fixed; inset: 0;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.05; pointer-events: none; z-index: 20; mix-blend-mode: overlay;
        }

        .vignette {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, transparent 10%, #000000 115%);
            pointer-events: none; z-index: 10;
        }

        .flicker-overlay {
            position: fixed; inset: 0; background-color: #2a0300; opacity: 0;
            pointer-events: none; z-index: 15; mix-blend-mode: color-burn;
        }

        .flicker-active { animation: bombFlicker 0.4s ease-out; }
        @keyframes bombFlicker {
            0% { opacity: 0; } 20% { opacity: 0.6; } 40% { opacity: 0.1; } 60% { opacity: 0.7; } 100% { opacity: 0; }
        }

        .shake-active { animation: groundShake 0.5s ease-out; }
        @keyframes groundShake {
            0% { transform: translate(0, 0); } 
            15% { transform: translate(-5px, 4px) rotate(-0.5deg); } 
            30% { transform: translate(5px, -4px) rotate(0.5deg); } 
            45% { transform: translate(-4px, -2px) rotate(-0.2deg); } 
            60% { transform: translate(3px, 3px) rotate(0.1deg); } 
            75% { transform: translate(-1px, -1px); }
            100% { transform: translate(0, 0); }
        }

        .fire-glow {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60vh;
            background: linear-gradient(to top, rgba(200, 30, 0, 0.45) 0%, rgba(100, 10, 0, 0.15) 50%, transparent 100%);
            pointer-events: none; z-index: 4; 
            animation: firePulse 4s infinite alternate ease-in-out;
            mix-blend-mode: screen;
            transform-origin: bottom;
        }
        @keyframes firePulse { 
            0% { opacity: 0.4; transform: scaleY(0.95); } 
            50% { opacity: 0.7; transform: scaleY(1.08); }
            100% { opacity: 0.5; transform: scaleY(1); } 
        }

        #ui-layer {
            position: fixed; inset: 0; z-index: 30;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; transition: opacity 1s ease;
            padding: max(2.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(2.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
            opacity: 1; 
        }

        .pointer-events-auto { pointer-events: auto; }

        .act-btn {
            position: relative; color: #a3a3a3; transition: all 0.6s ease;
            padding: 10px 0; opacity: 0.75;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .act-btn:hover { color: #ffffff; opacity: 1; letter-spacing: 0.25em; transform: translateX(-10px); text-shadow: 0 0 15px rgba(255,80,0,0.6); }

        #theater-curtain {
            position: fixed; inset: 0; background-color: #000; z-index: 50;
            opacity: 0; pointer-events: none; transition: opacity 2s ease;
        }
    </style>
</head>
<body class="font-serif antialiased bg-black">

    <audio id="bg-audio" src="music.mp3" loop="true" preload="auto" crossorigin="anonymous"></audio>

    <div id="bg-container">
        <div id="bg-pan-layer">
            <img class="bg-image" src="back.jpg" alt="防空洞場景" crossorigin="anonymous">
            <img class="bg-image" src="back.jpg" alt="防空洞場景" crossorigin="anonymous">
        </div>
    </div>

    <div class="fire-glow"></div>
    <canvas id="fire-canvas" class="fixed inset-0 z-[5] pointer-events-none"></canvas>
    <div class="vignette"></div>
    <div class="noise-overlay"></div>
    <div id="flicker-layer" class="flicker-overlay"></div>

    <div id="ui-layer">
        <header class="text-left drop-shadow-2xl">
            <h1 class="text-2xl md:text-4xl font-light tracking-[0.4em] text-gray-200">煙霧中長大的孩子</h1>
            <h2 class="text-xs md:text-sm text-gray-400 tracking-[0.3em] font-light mt-2">防空洞裡學會的事</h2>
        </header>

        <div class="absolute bottom-6 left-6 flex flex-col items-start gap-4 pointer-events-auto">
            <button onclick="showInfo('concept')" class="text-xs md:text-sm text-gray-500 hover:text-gray-300 tracking-[0.2em] transition-colors uppercase">劇本概念</button>
            <button onclick="showInfo('team')" class="text-xs md:text-sm text-gray-500 hover:text-gray-300 tracking-[0.2em] transition-colors uppercase">製作團隊</button>
        </div>

        <nav class="flex flex-col items-end gap-6 mt-auto pointer-events-auto">
            <button onclick="executeChapter(1)" class="act-btn text-sm md:text-base font-light">躲貓貓的規則</button>
            <button onclick="executeChapter(2)" class="act-btn text-sm md:text-base font-light">灰燼下的翅膀</button>
            <button onclick="executeChapter(3)" class="act-btn text-sm md:text-base font-light">掩蓋的真相</button>
            <button onclick="executeChapter(4)" class="act-btn text-sm md:text-base font-light">現實的恐懼</button>
            <button onclick="executeChapter(5)" class="act-btn text-sm md:text-base font-light">紙飛機的希望</button>
        </nav>
    </div>

    <div id="password-modal" class="fixed inset-0 bg-black/85 z-[1000] flex flex-col justify-center items-center opacity-0 pointer-events-none transition-opacity duration-500 backdrop-blur-sm">
        <div class="text-center bg-black/60 p-8 border border-stone-800 rounded-lg shadow-[0_0_50px_rgba(0,0,0,0.8)]">
            <!-- 加入 ID 讓 JavaScript 可以動態修改這段文字 -->
            <h3 id="password-hint" class="text-gray-300 tracking-[0.3em] font-light mb-6 text-sm md:text-base">此記憶已封印，請輸入解鎖密碼</h3>
            <input type="password" id="chapter-password" 
                   class="bg-transparent border-b border-gray-600 text-white text-center text-xl tracking-[0.5em] outline-none px-4 py-2 mb-2 w-48 focus:border-red-800 transition-colors"
                   autocomplete="off">
            <div id="pwd-error" class="text-red-700 text-xs tracking-[0.2em] h-4 mb-6 opacity-0 transition-opacity">密碼錯誤，請重新回憶</div>
            <div class="flex gap-10 justify-center">
                <button onclick="closePasswordModal()" class="text-gray-500 text-xs tracking-[0.2em] hover:text-white transition-colors">放棄</button>
                <button onclick="checkPassword()" class="text-gray-300 text-xs tracking-[0.2em] hover:text-red-600 transition-colors">解鎖</button>
            </div>
        </div>
    </div>

    <div id="info-modal" class="fixed inset-0 bg-black/85 z-[1000] flex flex-col justify-center items-center opacity-0 pointer-events-none transition-opacity duration-500 backdrop-blur-sm">
        <div class="bg-black/80 p-8 md:p-12 border border-stone-800 rounded-lg shadow-[0_0_50px_rgba(0,0,0,0.8)] max-w-2xl w-[85%] relative text-center">
            <button onclick="closeInfo()" class="absolute top-6 right-6 text-gray-500 hover:text-white transition-colors text-xl">✕</button>
            <h3 id="info-title" class="text-gray-200 tracking-[0.4em] font-light mb-8 text-lg md:text-xl border-b border-stone-800 pb-4 inline-block">標題</h3>
            <p id="info-content" class="text-gray-400 tracking-[0.2em] font-light leading-relaxed text-sm md:text-base text-left min-h-[150px]"></p>
        </div>
    </div>

    <div id="theater-curtain"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const bgAudio = document.getElementById('bg-audio');
            bgAudio.volume = 0.55;
            
            const attemptPlay = () => {
                const playPromise = bgAudio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log("背景音樂自動播放成功！");
                    }).catch(error => {
                        console.log("等待使用者首次點擊畫面以解鎖音效。");
                        const unlockAudio = () => {
                            bgAudio.play().then(() => {
                                window.removeEventListener('click', unlockAudio);
                                window.removeEventListener('touchstart', unlockAudio);
                            }).catch(e => console.warn("解鎖播放失敗:", e));
                        };
                        window.addEventListener('click', unlockAudio, { passive: true, once: true });
                        window.addEventListener('touchstart', unlockAudio, { passive: true, once: true });
                    });
                }
            };

            attemptPlay();
            startFearFlicker();
        });

        const bgPanLayer = document.getElementById('bg-pan-layer');
        const bgImages = document.querySelectorAll('.bg-image');
        
        let panSpeed = 0.35; 
        let currentX = 0;
        let imageWidth = 0;

        function resizeImage() {
            const img = bgImages[0];
            if (!img.naturalWidth) return;
            
            const imgRatio = img.naturalWidth / img.naturalHeight;
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            
            let targetH = winH;
            let targetW = targetH * imgRatio;
            
            if (targetW < winW) {
                targetW = winW;
                targetH = targetW / imgRatio;
            }
            
            bgImages.forEach(image => {
                image.style.width = targetW + 'px';
                image.style.height = targetH + 'px';
            });
            
            imageWidth = targetW;
        }

        if (bgImages[0].complete) resizeImage();
        bgImages[0].addEventListener('load', resizeImage);
        window.addEventListener('resize', resizeImage);

        function animatePan() {
            if (imageWidth > 0) {
                currentX -= panSpeed; 
                
                if (currentX <= -imageWidth) {
                    currentX += imageWidth;
                }
                bgPanLayer.style.transform = `translate3d(${currentX}px, 0, 0)`;
            }
            requestAnimationFrame(animatePan);
        }
        animatePan();

        const ui = document.getElementById('ui-layer');

        // 已移除點擊空白處時 UI 會變暗消失的程式碼
        // 讓使用者隨意點擊都不會干擾文字顯示

        function startFearFlicker() {
            const flicker = document.getElementById('flicker-layer');
            const sceneContainer = document.getElementById('bg-container');
            setInterval(() => {
                if (Math.random() > 0.65) {
                    flicker.classList.add('flicker-active');
                    sceneContainer.classList.add('shake-active');
                    setTimeout(() => {
                        flicker.classList.remove('flicker-active');
                        sceneContainer.classList.remove('shake-active');
                    }, 500);
                }
            }, 6000);
        }

        let pendingChapter = null;

        // 定義每個章節的專屬提示文字（可以自行修改這裡的文字）
        const chapterHints = {
            1: "黑暗中，躲避腳步聲的規則是什麼？",
            2: "抬頭望向天空，灰燼之下藏著什麼？",
            3: "大人們極力掩蓋的，究竟是什麼真相？",
            4: "防空洞搖晃的夜晚，你還記得那份恐懼嗎？",
            5: "手中緊握的紙飛機，它想飛往何方？"
        };

        function executeChapter(num) {
            openPasswordModal(num);
        }

        function openPasswordModal(num) {
            pendingChapter = num;
            const modal = document.getElementById('password-modal');
            
            // 動態更新上方的提示說明
            const hintElement = document.getElementById('password-hint');
            hintElement.innerText = chapterHints[num] || "此記憶已封印，請輸入解鎖密碼";

            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('chapter-password').value = '';
            document.getElementById('pwd-error').classList.add('opacity-0');
            setTimeout(() => document.getElementById('chapter-password').focus(), 100);
            
            // 打開視窗時讓背景選單變暗以突顯視窗
            ui.style.opacity = '0.08';
        }

        function closePasswordModal() {
            const modal = document.getElementById('password-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            pendingChapter = null;
            // 關閉視窗時恢復背景選單亮度
            ui.style.opacity = '1'; 
        }

        function checkPassword() {
            const pwd = document.getElementById('chapter-password').value;
            let isCorrect = false;

            if (pendingChapter === 1 && pwd === '11') isCorrect = true;
            else if (pendingChapter === 2 && pwd === '12') isCorrect = true;
            else if (pendingChapter === 3 && pwd === '13') isCorrect = true;
            else if (pendingChapter === 4 && pwd === '14') isCorrect = true;
            else if (pendingChapter === 5 && pwd === '15') isCorrect = true; 

            if (isCorrect) {
                let unlockedChapter = pendingChapter;
                closePasswordModal();
                proceedToChapter(unlockedChapter);
            } else {
                const errorEl = document.getElementById('pwd-error');
                errorEl.classList.remove('opacity-0');
                document.getElementById('chapter-password').value = '';
                
                const sceneContainer = document.getElementById('bg-container');
                sceneContainer.classList.add('shake-active');
                setTimeout(() => sceneContainer.classList.remove('shake-active'), 500);
            }
        }

        document.getElementById('chapter-password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        function showInfo(type) {
            const modal = document.getElementById('info-modal');
            const title = document.getElementById('info-title');
            const content = document.getElementById('info-content');

            if (type === 'concept') {
                title.innerText = '劇本概念';
                content.innerHTML = '《煙霧中長大的孩子》探討在戰火與防空洞中成長的童年。<br><br>我們試圖以孩子的視角，將殘酷的戰爭轉化為「躲貓貓」、「惡魔的翅膀」與「天空的禮物」等隱喻。在封閉且充滿恐懼的地下室裡，那些未能送達的愛與對光明的渴望，最終化作漫天星火，照亮了廢墟與黑夜。';
            } else if (type === 'team') {
                title.innerText = '製作團隊';
                content.innerHTML = '<div class="text-center">製作與程式開發<br><span class="text-gray-200">煙霧專案團隊</span><br><br>視覺與美術設計<br><span class="text-gray-200">視覺設計團隊</span><br><br>音效與配樂<br><span class="text-gray-200">聲音工程團隊</span><br><br><span class="text-xs text-stone-500 mt-4 block">特別感謝所有為此專案提供協助的朋友。</span></div>';
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            // 打開資訊時稍微暗化背景 UI
            ui.style.opacity = '0.08';
        }

        function closeInfo() {
            const modal = document.getElementById('info-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            // 恢復 UI 亮度
            ui.style.opacity = '1';
        }

        function proceedToChapter(num) {
            document.getElementById('theater-curtain').style.opacity = '1';
            setTimeout(() => window.location.href = `part${num}.html`, 2000);
        }

        const canvas = document.getElementById('fire-canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];      
        let flameParticles = []; 

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class AshAndSpark {
            constructor() { this.reset(true); }
            
            reset(init = false) {
                this.type = Math.random() > 0.65 ? 'spark' : 'ash';
                this.x = Math.random() * canvas.width;
                this.y = init ? Math.random() * canvas.height : (this.type === 'spark' ? canvas.height + 20 : -20);
                this.size = Math.random() * 2 + 0.5;
                this.speedY = this.type === 'spark' ? -(Math.random() * 2 + 0.8) : Math.random() * 0.6 + 0.2;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
                this.wobbleValue = Math.random() * Math.PI;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.wobbleValue) * 0.2;
                this.wobbleValue += this.wobbleSpeed;

                if (this.y < -20 || this.y > canvas.height + 20 || this.x < -10 || this.x > canvas.width + 10) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.fillStyle = this.type === 'spark' ? `rgba(255, 120, 30, ${this.opacity})` : `rgba(70, 70, 70, ${this.opacity})`;
                ctx.shadowBlur = this.type === 'spark' ? 6 : 0;
                ctx.shadowColor = 'rgba(255, 80, 0, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; 
            }
        }

        class FlameParticle {
            constructor() { this.reset(); this.y = canvas.height + Math.random() * 100; }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20 + Math.random() * 30;
                this.size = Math.random() * 50 + 20; 
                this.speedY = -(Math.random() * 3 + 1); 
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.life = 1.0;
                this.decay = Math.random() * 0.015 + 0.008; 
                this.heat = Math.random() > 0.4 ? 'orange' : 'yellow';
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.life * 8) * 0.8;
                this.life -= this.decay;
                this.size *= 0.95; 

            if (this.life <= 0 || this.size <= 1) {
                    this.reset();
                }
            }

            draw() {
                const alpha = this.life * 0.5;
                let r = 255, g = 0, b = 0;

                if (this.heat === 'yellow') {
                    g = Math.floor(190 * this.life + 60);
                } else {
                    g = Math.floor(110 * this.life + 20);
                }

                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
                grad.addColorStop(0.3, `rgba(${r}, ${g - 30 > 0 ? g - 30 : 0}, 0, ${alpha * 0.7})`);
                grad.addColorStop(1, `rgba(50, 0, 0, 0)`);

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initCanvas() {
            particles = [];
            flameParticles = [];
            for (let i = 0; i < 450; i++) particles.push(new AshAndSpark());
            for (let i = 0; i < 180; i++) flameParticles.push(new FlameParticle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.globalCompositeOperation = 'lighter';
            flameParticles.forEach(p => { p.update(); p.draw(); });

            ctx.globalCompositeOperation = 'source-over';
            particles.forEach(p => { p.update(); p.draw(); });

            requestAnimationFrame(animate);
        }

        initCanvas();
        animate();
    </script>
</body>
</html>
