<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>《煙霧中長大的孩子:防空洞裡學會的事》</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght=200;300;400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'serif': ['"Noto Serif TC"', 'serif'] },
                    colors: { 'ash-dark': '#050505', 'blood-red': '#4a0000' }
                }
            }
        }
    </script>

    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            color: #d1d1d1;
            overflow: hidden; 
            overscroll-behavior: none;
            user-select: none;
        }

        /* 【互動無縫 360 度環景視窗】
          改由 JavaScript 物理引擎接管，支援滑鼠與手機觸控拖曳
        */
        .panoramic-viewport {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 1;
            cursor: grab;
        }
        .panoramic-viewport:active {
            cursor: grabbing;
        }

        .panoramic-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 400%; /* 四倍寬度確保無縫拼接 */
            height: 100%;
            display: flex;
            will-change: transform;
        }

        .panoramic-slice {
            width: 25%;
            height: 100%;
            background-image: url('back.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .noise-overlay {
            position: fixed; inset: 0;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.05; pointer-events: none; z-index: 20; mix-blend-mode: overlay;
        }

        .vignette {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, transparent 10%, #000000 115%);
            pointer-events: none; z-index: 10;
        }

        /* 畫面的受撞擊震動與閃爍 */
        .flicker-overlay {
            position: fixed; inset: 0; background-color: #2a0300; opacity: 0;
            pointer-events: none; z-index: 15; mix-blend-mode: color-burn;
        }

        .flicker-active { animation: bombFlicker 0.4s ease-out; }
        @keyframes bombFlicker {
            0% { opacity: 0; } 20% { opacity: 0.6; } 40% { opacity: 0.1; } 60% { opacity: 0.7; } 100% { opacity: 0; }
        }

        .shake-active { animation: groundShake 0.5s ease-out; }
        @keyframes groundShake {
            0% { transform: translate(0, 0); } 
            15% { transform: translate(-5px, 4px) rotate(-0.5deg); } 
            30% { transform: translate(5px, -4px) rotate(0.5deg); } 
            45% { transform: translate(-4px, -2px) rotate(-0.2deg); } 
            60% { transform: translate(3px, 3px) rotate(0.1deg); } 
            75% { transform: translate(-1px, -1px); }
            100% { transform: translate(0, 0); }
        }

        /* 環境火光脈動 */
        .fire-glow {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60vh;
            background: linear-gradient(to top, rgba(200, 30, 0, 0.45) 0%, rgba(100, 10, 0, 0.15) 50%, transparent 100%);
            pointer-events: none; z-index: 4; 
            animation: firePulse 4s infinite alternate ease-in-out;
            mix-blend-mode: screen;
            transform-origin: bottom;
        }
        @keyframes firePulse { 
            0% { opacity: 0.4; transform: scaleY(0.95); } 
            50% { opacity: 0.7; transform: scaleY(1.08); }
            100% { opacity: 0.5; transform: scaleY(1); } 
        }

        #ui-layer {
            position: fixed; inset: 0; z-index: 30;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; transition: opacity 1s ease;
            padding: max(2.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(2.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
            opacity: 0; /* 初始隱藏，進入後顯現 */
        }

        .pointer-events-auto { pointer-events: auto; }

        .act-btn {
            position: relative; color: #a3a3a3; transition: all 0.6s ease;
            padding: 10px 0; opacity: 0.75;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .act-btn:hover { color: #ffffff; opacity: 1; letter-spacing: 0.25em; transform: translateX(-10px); text-shadow: 0 0 15px rgba(255,80,0,0.6); }

        /* 開場歷史帷幕 */
        #start-curtain {
            position: fixed; inset: 0; background-color: #080808; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1), transform 2s ease;
            cursor: pointer;
        }
        #start-curtain.fade-out {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        #theater-curtain {
            position: fixed; inset: 0; background-color: #000; z-index: 50;
            opacity: 0; pointer-events: none; transition: opacity 2s ease;
        }
    </style>
</head>
<body class="font-serif antialiased bg-black">

    <!-- 背景音樂 -->
    <audio id="bg-audio" src="music.mp3" loop preload="auto"></audio>

    <!-- 
      100% 成功加載的環景容器（支援手動拖曳）
    -->
    <div id="experience-scene" class="panoramic-viewport">
        <div class="panoramic-track">
            <div class="panoramic-slice"></div>
            <div class="panoramic-slice"></div>
            <div class="panoramic-slice"></div>
            <div class="panoramic-slice"></div>
        </div>
    </div>

    <!-- 環境火光 -->
    <div class="fire-glow"></div>
    
    <!-- 終極火焰、火星與灰燼 Canvas -->
    <canvas id="fire-canvas" class="fixed inset-0 z-[5] pointer-events-none"></canvas>
    
    <!-- 氛圍濾鏡 -->
    <div class="vignette"></div>
    <div class="noise-overlay"></div>
    <div id="flicker-layer" class="flicker-overlay"></div>

    <!-- 互動開場帷幕 -->
    <div id="start-curtain" onclick="startExperience()">
        <div class="text-center px-6">
            <p class="text-xs tracking-[0.4em] text-red-700 font-light mb-4 uppercase">Shellproof Shelter Memories</p>
            <h2 class="text-xl md:text-2xl font-light tracking-[0.5em] text-gray-300 mb-8">防空洞深處，我們聽著外面的聲音...</h2>
            <div class="inline-block px-8 py-3 border border-stone-800 text-stone-400 text-xs tracking-[0.3em] uppercase hover:text-white hover:border-red-900 transition-all duration-700 ease-in-out">
                點擊 進入記憶
            </div>
        </div>
    </div>

    <!-- UI 選單層 -->
    <div id="ui-layer">
        <header class="text-left drop-shadow-2xl">
            <h1 class="text-2xl md:text-4xl font-light tracking-[0.4em] text-gray-200">煙霧中長大的孩子</h1>
            <h2 class="text-xs md:text-sm text-gray-400 tracking-[0.3em] font-light mt-2">防空洞裡學會的事</h2>
        </header>

        <nav class="flex flex-col items-end gap-6 mt-auto pointer-events-auto">
            <button onclick="executeChapter(1)" class="act-btn text-sm md:text-base font-light">幕一：躲貓貓的規則</button>
            <button onclick="executeChapter(2)" class="act-btn text-sm md:text-base font-light">幕二：惡魔的翅膀</button>
            <button onclick="executeChapter(3)" class="act-btn text-sm md:text-base font-light">幕三：天空的禮物</button>
            <button onclick="executeChapter(4)" class="act-btn text-sm md:text-base font-light">終幕：進入記憶</button>
        </nav>
    </div>

    <!-- 切換章節黑幕 -->
    <div id="theater-curtain"></div>

    <script>
        // ==========================================
        //  360度互動拖曳與物理慣性系統
        // ==========================================
        const track = document.querySelector('.panoramic-track');
        const sceneContainer = document.getElementById('experience-scene');
        
        let isDragging = false;
        let startX = 0;
        let startOffset = 0;
        let offsetPx = 0;            // 當前滾動的像素位置
        let velocity = 0;            // 當前滑動速度（用於物理慣性）
        let lastX = 0;
        const autoScrollSpeed = -0.3; // 自動旋轉的微弱速度（向左慢速滾動）

        // 取得單張環景切片的寬度（等於一個視窗寬度）
        function getMaxScroll() {
            return window.innerWidth;
        }

        // 限制與無縫重設滾動位置
        function wrapOffset() {
            const maxScroll = getMaxScroll();
            if (offsetPx < -maxScroll) {
                offsetPx += maxScroll;
                startOffset += maxScroll;
            }
            if (offsetPx > 0) {
                offsetPx -= maxScroll;
                startOffset -= maxScroll;
            }
        }

        function handleStart(clientX) {
            // 如果還沒點擊開場帷幕，禁止拖曳
            if (!document.getElementById('start-curtain').classList.contains('fade-out')) return;
            isDragging = true;
            startX = clientX;
            lastX = clientX;
            startOffset = offsetPx;
            velocity = 0;
        }

        function handleMove(clientX) {
            if (!isDragging) return;
            const dx = clientX - startX;
            offsetPx = startOffset + dx;
            
            // 計算並累積滑動速度（用於釋放後的慣性）
            velocity = clientX - lastX;
            lastX = clientX;

            // 連帶影響火焰特效的風向
            mouse.speedX = velocity * 0.4;

            wrapOffset();
        }

        function handleEnd() {
            isDragging = false;
        }

        // 監聽電腦滑鼠拖曳
        sceneContainer.addEventListener('mousedown', (e) => handleStart(e.clientX));
        window.addEventListener('mousemove', (e) => handleMove(e.clientX));
        window.addEventListener('mouseup', handleEnd);

        // 監聽手機與平板觸控
        sceneContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) handleStart(e.touches[0].clientX);
        });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) handleMove(e.touches[0].clientX);
        });
        window.addEventListener('touchend', handleEnd);


        // ==========================================
        //  主要流程控制
        // ==========================================
        function startExperience() {
            const startCurtain = document.getElementById('start-curtain');
            const bgAudio = document.getElementById('bg-audio');
            const uiLayer = document.getElementById('ui-layer');

            // 啟動背景音樂
            bgAudio.volume = 0.55;
            bgAudio.play().catch(e => console.log("音樂播放受阻：", e));

            // 開場畫面淡出
            startCurtain.classList.add('fade-out');
            
            // 延遲呈現選單
            setTimeout(() => {
                uiLayer.style.opacity = '1';
            }, 1000);

            // 隨機空襲震動
            startFearFlicker();
        }

        // 自動隱藏 UI
        let uiTimer;
        const ui = document.getElementById('ui-layer');
        window.addEventListener('mousedown', () => {
            if(document.getElementById('start-curtain').classList.contains('fade-out')) {
                ui.style.opacity = '0.08';
                clearTimeout(uiTimer);
            }
        });
        window.addEventListener('mouseup', () => {
            if(document.getElementById('start-curtain').classList.contains('fade-out')) {
                uiTimer = setTimeout(() => ui.style.opacity = '1', 1800);
            }
        });

        function startFearFlicker() {
            const flicker = document.getElementById('flicker-layer');
            const scene = document.getElementById('experience-scene');
            setInterval(() => {
                if (Math.random() > 0.65) {
                    flicker.classList.add('flicker-active');
                    scene.classList.add('shake-active');
                    setTimeout(() => {
                        flicker.classList.remove('flicker-active');
                        scene.classList.remove('shake-active');
                    }, 500);
                }
            }, 6000);
        }

        function executeChapter(num) {
            document.getElementById('theater-curtain').style.opacity = '1';
            setTimeout(() => window.location.href = `part${num}.html`, 2000);
        }

        // ==========================================
        //  超寫實 Canvas 火焰、火星與灰燼特效
        // ==========================================
        const canvas = document.getElementById('fire-canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];      
        let flameParticles = []; 
        let mouse = { x: undefined, y: undefined, speedX: 0 };
        let lastMouseX = 0;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            // 僅在沒有拖曳背景時，使用滑鼠移動計算微風
            if (!isDragging) {
                mouse.speedX = (e.clientX - lastMouseX) * 0.15;
            }
            lastMouseX = e.clientX;
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class AshAndSpark {
            constructor() { this.reset(true); }
            
            reset(init = false) {
                this.type = Math.random() > 0.65 ? 'spark' : 'ash';
                this.x = Math.random() * canvas.width;
                this.y = init ? Math.random() * canvas.height : (this.type === 'spark' ? canvas.height + 20 : -20);
                this.size = Math.random() * 2 + 0.5;
                this.speedY = this.type === 'spark' ? -(Math.random() * 2 + 0.8) : Math.random() * 0.6 + 0.2;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
                this.wobbleValue = Math.random() * Math.PI;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.wobbleValue) * 0.2 + (mouse.speedX * 0.1);
                this.wobbleValue += this.wobbleSpeed;

                if (this.type === 'spark' && mouse.x) {
                    let dx = mouse.x - this.x;
                    if (Math.abs(dx) < 150) {
                        this.x += dx * 0.01;
                    }
                }

                if (this.y < -20 || this.y > canvas.height + 20 || this.x < -10 || this.x > canvas.width + 10) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.fillStyle = this.type === 'spark' ? `rgba(255, 120, 30, ${this.opacity})` : `rgba(70, 70, 70, ${this.opacity})`;
                ctx.shadowBlur = this.type === 'spark' ? 6 : 0;
                ctx.shadowColor = 'rgba(255, 80, 0, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; 
            }
        }

        class FlameParticle {
            constructor() { this.reset(); this.y = canvas.height + Math.random() * 100; }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20 + Math.random() * 30;
                this.size = Math.random() * 50 + 20; 
                this.speedY = -(Math.random() * 3 + 1); 
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.life = 1.0;
                this.decay = Math.random() * 0.015 + 0.008; 
                this.heat = Math.random() > 0.4 ? 'orange' : 'yellow';
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.life * 8) * 0.8 + (mouse.speedX * 0.15);
                this.life -= this.decay;
                this.size *= 0.95; 

                if (this.life <= 0 || this.size <= 1) {
                    this.reset();
                }
            }

            draw() {
                const alpha = this.life * 0.5;
                let r = 255, g = 0, b = 0;

                if (this.heat === 'yellow') {
                    g = Math.floor(190 * this.life + 60);
                } else {
                    g = Math.floor(110 * this.life + 20);
                }

                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
                grad.addColorStop(0.3, `rgba(${r}, ${g - 30 > 0 ? g - 30 : 0}, 0, ${alpha * 0.7})`);
                grad.addColorStop(1, `rgba(50, 0, 0, 0)`);

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initCanvas() {
            particles = [];
            flameParticles = [];
            for (let i = 0; i < 450; i++) {
                particles.push(new AshAndSpark());
            }
            for (let i = 0; i < 180; i++) {
                flameParticles.push(new FlameParticle());
            }
        }

        // 渲染動畫迴圈
        function animate() {
            // --- 更新 360 度背景位置與慣性物理 ---
            if (!isDragging) {
                if (Math.abs(velocity) > 0.1) {
                    offsetPx += velocity;
                    velocity *= 0.95; // 阻尼減速
                    wrapOffset();
                } else {
                    offsetPx += autoScrollSpeed; // 恢復緩慢自動滾動
                    wrapOffset();
                }
            }
            track.style.transform = `translate3d(${offsetPx}px, 0, 0)`;

            // --- 繪製畫布特效 ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 火焰 (lighter 疊加高光模式)
            ctx.globalCompositeOperation = 'lighter';
            flameParticles.forEach(p => {
                p.update();
                p.draw();
            });

            // 2. 灰燼 (source-over 一般模式)
            ctx.globalCompositeOperation = 'source-over';
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // 風力阻尼漸弱
            mouse.speedX *= 0.95;

            requestAnimationFrame(animate);
        }

        initCanvas();
        animate();
    </script>
</body>
</html>
